<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --fit:#12805c; --no:#c4320a; --cant:#7a5af8; --acc:#2f54eb; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; max-width:340px; }
  .prog { margin-left:auto; color:var(--muted); font-size:13px; }
  main { flex:1; display:grid; grid-template-columns:minmax(320px,38%) 1fr; gap:12px; padding:12px 16px; min-height:0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; min-height:0; }
  .left { padding:16px; }
  .left h2 { margin:0 0 4px; font-size:20px; }
  .links a { color:var(--acc); margin-right:12px; font-size:13px; }
  .facts { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; margin:12px 0; font-size:13px; }
  .facts div:nth-child(odd) { color:var(--muted); }
  .block { margin-top:14px; }
  .block h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 4px; }
  .pipe { border:1px solid var(--line); border-radius:8px; padding:10px; background:#fafbfc; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; }
  .b-fit { background:var(--fit); } .b-no { background:var(--no); } .b-unk { background:var(--muted); }
  details summary { cursor:pointer; color:var(--acc); font-size:13px; }
  .iap { white-space:pre-wrap; font-size:12.5px; background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:6px; max-height:360px; overflow:auto; }
  .right { display:flex; flex-direction:column; }
  .tabs { display:flex; gap:4px; padding:8px; border-bottom:1px solid var(--line); align-items:center; }
  .tabs button { font:inherit; border:1px solid var(--line); background:#fff; padding:5px 12px; border-radius:6px; cursor:pointer; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tabs .hint { margin-left:auto; color:var(--muted); font-size:12px; }
  .view { flex:1; min-height:0; }
  iframe { width:100%; height:100%; border:0; background:#fff; }
  .sitetext { white-space:pre-wrap; padding:14px; font-size:13px; overflow:auto; height:100%; }
  footer { background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; }
  textarea { flex:1; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; resize:none; height:44px; }
  textarea.need { border-color:var(--no); box-shadow:0 0 0 2px #fee4e2; }
  .btn { font:inherit; font-weight:600; border:0; border-radius:999px; height:52px; min-width:52px; padding:0 18px; cursor:pointer; color:#fff; display:flex; align-items:center; gap:6px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .no { background:var(--no); } .fit { background:var(--fit); } .cant { background:var(--cant); }
  .skip { background:#fff; color:var(--muted); border:1px solid var(--line); }
  .msg { padding:40px; text-align:center; color:var(--muted); grid-column:1/-1; }
  .err { color:var(--no); }
  @media (max-width:820px) { main { grid-template-columns:1fr; } .right { height:60vh; } footer { flex-wrap:wrap; } textarea { flex-basis:100%; } }
</style>
</head>
<body>
<header>
  <h1>IAP Review</h1>
  <select id="reviewer"><option value="">Your name…</option></select>
  <select id="campaign"><option value="">Campaign…</option></select>
  <span class="prog" id="prog"></span>
</header>
<main id="main"><div class="msg">Loading…</div></main>
<footer>
  <button class="btn no" id="bNo" title="Not a fit (←)" disabled>✕ Not a fit</button>
  <button class="btn cant" id="bCant" title="Can't tell (↓)" disabled>? Can't tell</button>
  <textarea id="reason" placeholder="Reason (required for Not a fit)"></textarea>
  <button class="btn skip" id="bSkip" title="Skip" disabled>Skip</button>
  <button class="btn fit" id="bFit" title="Fit (→)" disabled>✓ Fit</button>
</footer>

<script>
var S = { init: null, card: null, skips: [], busy: false };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, fail) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail); r[fn].apply(r, args); });
}
function setButtons(on) { ['bNo','bCant','bSkip','bFit'].forEach(function (id) { $(id).disabled = !on; }); }
function showMsg(html) { $('main').innerHTML = '<div class="msg">' + html + '</div>'; setButtons(false); }

function renderProgress(p) {
  if (!p) { $('prog').textContent = ''; return; }
  var judged = p.agree + p.disagree;
  $('prog').textContent = p.reviewed + ' / ' + p.target + ' reviewed · ' + p.fit + ' fit · ' + p.notFit + ' not a fit · ' + p.cant + " can't tell" +
    (judged ? ' · team agrees with pipeline ' + Math.round(100 * p.agree / judged) + '%' : '');
}

function renderCard(d) {
  var c = d.company, p = d.pipeline;
  var badge = p.verdict === 'Fit' ? 'b-fit' : p.verdict === 'Not a fit' ? 'b-no' : 'b-unk';
  var facts = [['Location', c.location], ['Employees', c.employees], ['Industry', c.industry], ['Niche', c.industryGroup],
               ['Ownership', c.ownership], ['Phone', c.phone], ['Keywords', c.keywords]]
    .filter(function (f) { return f[1]; })
    .map(function (f) { return '<div>' + esc(f[0]) + '</div><div>' + esc(f[1]) + '</div>'; }).join('');
  var left = '<section class="panel left">' +
    '<h2>' + esc(c.name) + '</h2>' +
    '<div class="links">' + (c.website ? '<a href="' + esc(c.website) + '" target="_blank" rel="noopener">Open website ↗</a>' : '') +
      (c.linkedin ? '<a href="' + esc(c.linkedin) + '" target="_blank" rel="noopener">LinkedIn ↗</a>' : '') +
      '<a href="' + esc(c.hubspotUrl) + '" target="_blank" rel="noopener">HubSpot ↗</a></div>' +
    '<div class="facts">' + facts + '</div>' +
    (c.description ? '<div class="block"><h3>Description</h3>' + esc(c.description) + '</div>' : '') +
    '<div class="block"><h3>Pipeline</h3><div class="pipe"><span class="badge ' + badge + '">' + esc(p.verdict) + '</span> ' +
      (p.score !== '' ? '<b>Score ' + esc(p.score) + '/5</b>' : '') + (p.date ? ' <span style="color:var(--muted)">· ' + esc(p.date) + '</span>' : '') +
      (p.reason ? '<div style="margin-top:6px">' + esc(p.reason) + '</div>' : '') + '</div></div>' +
    '<div class="block"><details><summary>IAP: ' + esc(d.campaign.name) + '</summary><div class="iap">' + esc(d.campaign.iap || 'No IAP description in HubSpot.') + '</div></details></div>' +
    '</section>';
  var right = '<section class="panel right"><div class="tabs">' +
    '<button id="tSite" class="on">Website</button><button id="tText">Website summary</button>' +
    '<span class="hint">Blank? The site blocks previews: use "Website summary" or "Open website".</span></div>' +
    '<div class="view" id="view"></div></section>';
  $('main').innerHTML = left + right;
  var view = $('view');
  function site() { $('tSite').className = 'on'; $('tText').className = '';
    view.innerHTML = c.website ? '<iframe src="' + esc(c.website) + '" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>' : '<div class="sitetext">No website on record.</div>'; }
  function text() { $('tText').className = 'on'; $('tSite').className = '';
    view.innerHTML = '<div class="sitetext">' + esc(c.summary || 'No website summary yet. It is written when the pipeline enriches (stage 2) this company.') + '</div>'; }
  $('tSite').onclick = site; $('tText').onclick = text;
  if (c.website) site(); else text();
  $('reason').value = ''; $('reason').classList.remove('need');
  setButtons(true);
}

function loadNext() {
  var rev = $('reviewer').value, camp = $('campaign').value;
  if (!rev || !camp) { showMsg('Pick your name and a campaign to start.'); renderProgress(null); return; }
  showMsg('Loading next company…');
  call('getNext', camp, rev, S.skips).then(function (d) {
    S.card = d; renderProgress(d.progress);
    if (d.done) { showMsg(d.empty ? 'No more companies to review for this campaign.' : 'Target reached for this campaign. Thank you!'); return; }
    renderCard(d);
  }).catch(function (e) { showMsg('<span class="err">' + esc(e.message || e) + '</span>'); });
}

function submit(verdict) {
  if (S.busy || !S.card || S.card.done) return;
  var reason = $('reason').value.trim();
  if (verdict === 'notfit' && !reason) { $('reason').classList.add('need'); $('reason').focus(); return; }
  var d = S.card;
  S.busy = true; setButtons(false);
  call('submitReview', {
    reviewer: $('reviewer').value, campaignId: d.campaign.id, campaignName: d.campaign.name,
    companyId: d.company.id, companyName: d.company.name, website: d.company.website, hubspotUrl: d.company.hubspotUrl,
    pipelineScore: d.pipeline.score, pipelineReason: d.pipeline.reason, pipelineVerdict: d.pipeline.verdict,
    verdict: verdict, reason: reason
  }).then(function (r) { S.busy = false; renderProgress(r.progress); loadNext(); })
    .catch(function (e) { S.busy = false; setButtons(true); alertBar(e.message || e); });
}
function alertBar(m) { $('prog').innerHTML = '<span class="err">' + esc(m) + '</span>'; }

function skip() {
  if (!S.card || S.card.done) return;
  S.skips.push(S.card.company.id);
  call('releaseClaim', S.card.campaign.id, S.card.company.id).catch(function () {});
  loadNext();
}

$('bFit').onclick = function () { submit('fit'); };
$('bNo').onclick = function () { submit('notfit'); };
$('bCant').onclick = function () { submit('cant'); };
$('bSkip').onclick = skip;
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') submit('fit');
  else if (e.key === 'ArrowLeft') submit('notfit');
  else if (e.key === 'ArrowDown') submit('cant');
});
$('reviewer').onchange = function () { store('iapReviewer', this.value); loadNext(); };
$('campaign').onchange = function () { store('iapCampaign', this.value); S.skips = []; loadNext(); };

call('getInit').then(function (init) {
  S.init = init;
  var rs = $('reviewer');
  init.reviewers.forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; rs.appendChild(o); });
  if (!init.reviewers.length) rs.innerHTML = '<option value="">No reviewers listed yet</option>';
  var cs = $('campaign');
  init.campaigns.forEach(function (c) { var o = document.createElement('option'); o.value = c.id; o.textContent = c.name; cs.appendChild(o); });
  var r = store('iapReviewer'), c = store('iapCampaign');
  if (r && init.reviewers.indexOf(r) >= 0) rs.value = r;
  if (c && init.campaigns.some(function (x) { return x.id === c; })) cs.value = c;
  loadNext();
}).catch(function (e) { showMsg('<span class="err">' + esc(e.message || e) + '</span>'); });
</script>
</body>
</html>
